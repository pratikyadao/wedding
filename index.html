<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>{{TITLE}}</title>
    <meta name="title" content="{{TITLE}}">
    <meta name="description" content="{{DESC}}">
    <link rel="canonical" href="{{URL}}">

    <!-- Open Graph / Facebook / WhatsApp (Needs raw HTML execution to render) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{URL}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESC}}">
    <!-- Essential for WhatsApp: og:image must be an absolute URL or relative to root -->
    <meta property="og:image" content="{{URL}}/og-image.jpg">
    <!-- Optional but highly recommended for WhatsApp scaling -->
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{URL}}">
    <meta property="twitter:title" content="{{TITLE}}">
    <meta property="twitter:description" content="{{DESC}}">
    <meta property="twitter:image" content="{{URL}}/og-image.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
